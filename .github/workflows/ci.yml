name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (vet • lint • vuln • test • build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Always the newest 1.26 patch: govulncheck fails on standard-library advisories fixed upstream.
          go-version: "1.26.x"
          check-latest: true
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt (must be clean)
        run: test -z "$(gofmt -l .)" || { echo 'Run gofmt -w .'; gofmt -l .; exit 1; }

      - name: Lint (golangci-lint)
        # v6 pins golangci-lint v1.x, which is built with Go 1.24 and refuses Go 1.26 modules.
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: Static security analysis (gosec)
        uses: securego/gosec@master
        with:
          args: ./...

      - name: Vulnerability scan (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build
        run: go build ./...

  contract:
    name: Snapshot contract (golden vs evonhi-core schema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the golden payload against the published contract and adapter
        env:
          CORE_REF: v0.2.2
        run: |
          pip install jsonschema "evonhi-core @ git+https://github.com/${{ github.repository_owner }}/evonhi-core.git@${CORE_REF}"
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository_owner }}/evonhi-core/${CORE_REF}/contracts/cluster-snapshot.v1.schema.json" -o schema.json
          python - <<'PY'
          import json, jsonschema
          from evonhi_core.providers.kubernetes.snapshot import cluster_model_from_snapshot
          payload = json.load(open("internal/k8s/testdata/snapshot.golden.json"))
          jsonschema.validate(payload, json.load(open("schema.json")))
          model = cluster_model_from_snapshot(payload)
          print(f"contract OK: {len(model.workloads)} workloads, {len(model.role_bindings)} bindings")
          PY

  e2e:
    name: End to end on kind (in-cluster run against a real API server)
    runs-on: ubuntu-latest
    env:
      CORE_REF: v0.2.2
    steps:
      - uses: actions/checkout@v4

      - name: Create a kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: e2e

      - name: Build the image and load it into the cluster
        run: |
          docker build -t evonhi-collector:e2e .
          kind load docker-image evonhi-collector:e2e --name e2e

      - name: Deploy the fixtures
        run: |
          kubectl apply -f test/e2e/fixtures.yaml
          kubectl -n shop create secret generic db-creds --from-literal=password=not-a-real-secret
          kubectl -n shop rollout status deployment/web deployment/db-worker --timeout=180s

      - name: Install the chart in audit (dry-run) mode
        run: |
          helm install collector deploy/helm/evo-collector --namespace evonhi --create-namespace \
            --set image.repository=evonhi-collector --set image.tag=e2e --set image.pullPolicy=Never \
            --set clusterId=kind-e2e --set dryRun=true --set token.value=unused --set hmacKey=unused

      - name: Run the agent once with the chart's own ServiceAccount and RBAC
        run: |
          kubectl -n evonhi create job e2e --from=cronjob/collector-evo-collector
          if ! kubectl -n evonhi wait --for=condition=complete job/e2e --timeout=180s; then
            kubectl -n evonhi describe job/e2e
            kubectl -n evonhi logs job/e2e --tail=50
            exit 1
          fi
          kubectl -n evonhi logs job/e2e > payload.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate the payload and analyze it with evonhi-core
        run: |
          pip install jsonschema "evonhi-core @ git+https://github.com/${{ github.repository_owner }}/evonhi-core.git@${CORE_REF}"
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository_owner }}/evonhi-core/${CORE_REF}/contracts/cluster-snapshot.v1.schema.json" -o schema.json
          python test/e2e/check.py payload.json schema.json

  image:
    name: Container image (build • scan • push • sign)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/evonhi-collector
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "$IMAGE:${{ github.sha }}" .

      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      # Only tags publish. cosign signs a registry digest, so the image must be pushed first
      # (signing a local, never-pushed tag cannot work).
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image
        if: startsWith(github.ref, 'refs/tags/v')
        id: push
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:$version"
          docker push "$IMAGE:$version"
          echo "digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$version")" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@v3

      - name: Sign image digest (keyless)
        if: startsWith(github.ref, 'refs/tags/v')
        run: cosign sign --yes "${{ steps.push.outputs.digest }}"
