# A small, deliberately risky namespace for the end-to-end test:
#   web (public through a LoadBalancer Service) can patch deployments in the namespace, which lets it
#   run a pod as admin-sa, and admin-sa can read the db-creds secret mounted by db-worker.
apiVersion: v1
kind: Namespace
metadata:
  name: shop
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: web-sa, namespace: shop}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: admin-sa, namespace: shop}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: deployer, namespace: shop}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: secret-reader, namespace: shop}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: web-deploys, namespace: shop}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: deployer}
subjects:
  - {kind: ServiceAccount, name: web-sa, namespace: shop}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: admin-reads, namespace: shop}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: secret-reader}
subjects:
  - {kind: ServiceAccount, name: admin-sa, namespace: shop}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      serviceAccountName: web-sa
      containers:
        - {name: web, image: "registry.k8s.io/pause:3.9"}
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: shop}
spec:
  type: LoadBalancer
  selector: {app: web}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: db-worker, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: db-worker}}
  template:
    metadata: {labels: {app: db-worker}}
    spec:
      serviceAccountName: admin-sa
      containers:
        - name: worker
          image: "registry.k8s.io/pause:3.9"
          volumeMounts: [{name: creds, mountPath: /creds, readOnly: true}]
      volumes:
        - {name: creds, secret: {secretName: db-creds}}
---
# Exercises the batch and networking API groups the agent must be allowed to list.
apiVersion: batch/v1
kind: CronJob
metadata: {name: nightly, namespace: shop}
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - {name: job, image: "registry.k8s.io/pause:3.9"}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: api, namespace: shop}
spec:
  rules:
    - http:
        paths:
          - path: /worker
            pathType: Prefix
            backend: {service: {name: db-worker, port: {number: 80}}}
---
apiVersion: v1
kind: Service
metadata: {name: db-worker, namespace: shop}
spec:
  selector: {app: db-worker}
  ports: [{port: 80, targetPort: 80}]
